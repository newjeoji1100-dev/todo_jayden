<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>촬영감독의 컷 체크리스트</title>
</head>
<body>
  <h1>촬영감독의 컷 체크리스트</h1>

  <section>
    <h2>카메라 A · 24-70mm 렌즈</h2>
    <ul>
      <li><input type="checkbox" id="cut-1"> <label for="cut-1">[사진] 현장 전경</label></li>
      <li><input type="checkbox" id="cut-2"> <label for="cut-2">[영상] 인터뷰 와이드</label></li>
    </ul>
  </section>

  <section>
    <h2>카메라 B · 85mm 렌즈</h2>
    <ul>
      <li><input type="checkbox" id="cut-3" checked> <label for="cut-3">[사진] 인물 클로즈업</label></li>
      <li><input type="checkbox" id="cut-4"> <label for="cut-4">[영상] 손동작 디테일</label></li>
    </ul>
  </section>
</body>
</html>
